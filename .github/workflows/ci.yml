name: CI

# 三档 CI（0001 Task 9）：
# 1. no-sdk   —— GitHub hosted（ubuntu）：无 CANN SDK，lint + 单测（默认特性）
# 2. ffi      —— 自托管 runner（label: ascend-sdk）：有 CANN SDK 环境，--features ffi 编译
# 3. npu      —— 自托管 runner（label: ascend-npu 且需驱动）：真机 smoke（--ignored 集成）
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  no-sdk:
    name: Lint & Test (no SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ffi:
    name: FFi compile (with SDK)
    runs-on: [self-hosted, ascend-sdk]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # SDK 探测：build.rs 依 ASCEND_TOOLKIT_HOME（runner 预置）或默认搜索路径
      - run: cargo clippy --workspace --all-targets --features ffi -- -D warnings
      - run: cargo build --workspace --features ffi

  npu:
    name: Smoke tests (NPU driver)
    runs-on: [self-hosted, ascend-npu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --features ffi -- --ignored
