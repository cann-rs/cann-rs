[package]
name = "cann"
version = "0.1.1"
edition = "2024"
build = "build.rs"
description = "Safe Rust wrapper for Huawei Ascend CANN NPU SDK"
repository = "https://github.com/cann-rs/cann-rs"
documentation = "https://docs.rs/cann"
license = "MIT OR Apache-2.0"
keywords = ["ascend", "cann", "huawei", "npu"]
categories = ["api-bindings", "hardware-support"]
readme = "../README.md"

[features]
default = []
# 启用 FFI 链接（转发 cann-sys/ffi），默认关闭：无 SDK 环境可编译并跑类型/单测（0001 Task 6 决策）
ffi = ["cann-sys/ffi"]

[dependencies]
cann-sys = { path = "../cann-sys", version = "0.1.1" }
